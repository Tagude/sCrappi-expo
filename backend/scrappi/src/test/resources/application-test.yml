# Perfil de pruebas: H2 en memoria, se crea y se borra en cada ejecución
spring:
  datasource:
    url: jdbc:h2:mem:scrappi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: WARN
